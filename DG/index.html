<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP – Židle</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/fonts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="stage" id="stage">
  <svg id="bggrid" aria-hidden="true"></svg>
  <svg id="sheet" viewBox="5 5 287 200" role="img" aria-label="Výkres A4: lineární perspektiva"></svg>

  <button id="play" aria-label="Přehrát pohyb po základnici" aria-pressed="false"></button>
  <svg id="slider" viewBox="5 -2 287 12" tabindex="0" role="slider" aria-label="Poloha rohu A na základnici"></svg>

  <div class="panel">
    <section class="sec s-head">
      <div class="title" id="title">LP – ŽIDLE</div>
      <div class="headrow">
        <input class="fld name" id="f_name" value="Johana Hlaváčová" aria-label="Jméno na výkrese" spellcheck="false">
        <input class="fld no" id="f_no" value="01" aria-label="Číslo listu, 01 až 04 načte zadání z podkladu" inputmode="numeric" maxlength="2">
      </div>
    </section>

    <section class="sec s-typ">
      <h2>TYP</h2>
      <div class="types">
        <button data-type="chair" aria-pressed="true" aria-label="Židle"><svg viewBox="0 0 77 77" aria-hidden="true"><path class="ic" d="M24 7.5V68.5M24 36.4H53.7V68.5"/></svg></button>
        <button data-type="stool" aria-pressed="false" aria-label="Stolička"><svg viewBox="0 0 77 77" aria-hidden="true"><path class="ic" d="M26.84 68.5V34.14H49.86V68.5"/></svg></button>
        <button data-type="table" aria-pressed="false" aria-label="Stůl"><svg viewBox="0 0 77 77" aria-hidden="true"><path class="ic" d="M8 36.4H69M16.7 36.4V68.5M60.3 36.4V68.5"/></svg></button>
      </div>
    </section>

    <section class="sec s-var">
      <h2>PROMĚNNÉ</h2>
      <div class="rows">
        <span>α</span><span><input class="vinp" id="f_alpha" inputmode="decimal" aria-label="Natočení α ve stupních" data-key="alpha" data-step="1">°</span>
        <span>A</span><span id="v_A"></span>
        <span>A′</span><span id="v_A2"></span>
        <span>U</span><span id="v_U"></span>
        <span>U′</span><span id="v_U2"></span>
        <span>ZORNÝ KRUH</span><span id="v_K"></span>
      </div>
    </section>

    <section class="sec s-dim">
      <h2>DIMENZE</h2>
      <div class="rows">
        <span>ŠÍŘKA:</span><span class="dval"><input class="fld" data-key="W" data-step="10" inputmode="decimal" aria-label="Šířka v mm"><span>[mm]</span></span>
        <span>VÝŠKA:</span><span class="dval"><input class="fld" data-key="H" data-step="10" inputmode="decimal" aria-label="Výška v mm"><span>[mm]</span></span>
        <span>HLOUBKA:</span><span class="dval"><input class="fld" data-key="D" data-step="10" inputmode="decimal" aria-label="Hloubka v mm"><span>[mm]</span></span>
        <span>X:</span><span class="dval"><input class="fld" data-key="X" data-step="10" inputmode="decimal" aria-label="X: poloha rohu A podél základnice v mm"><span>[mm]</span></span>
        <span>Y:</span><span class="dval"><input class="fld" data-key="Y" data-step="10" inputmode="decimal" aria-label="Y: hloubka za průmětnou v mm"><span>[mm]</span></span>
        <span>Z:</span><span class="dval"><input class="fld" data-key="Z" data-step="10" inputmode="decimal" aria-label="Z: výška nad půdorysnou v mm"><span>[mm]</span></span>
      </div>
    </section>

    <section class="sec s-show">
      <h2>ZOBRAZIT</h2>
      <div class="checks">
        <label class="chk"><input type="checkbox" id="s_constr" checked><span class="bx"></span>H, Z, H, D/2, ZORNÝ KRUH</label>
        <label class="chk"><input type="checkbox" id="s_vlines" checked><span class="bx"></span>ÚBĚŽNÍKY U, U′ A ÚBĚŽNICE</label>
        <label class="chk"><input type="checkbox" id="s_plan" checked><span class="bx"></span>SKLOPENÝ PŮDORYS</label>
        <label class="chk"><input type="checkbox" id="s_hidden" checked><span class="bx"></span>NEVIDITELNÉ HRANY</label>
        <div class="chkrow"><label class="chk"><input type="checkbox" id="s_pins" checked><span class="bx"></span>PŘIPNUTÉ POLOHY</label>
          <span class="pinbtns"><button id="pin" aria-label="Připnout aktuální polohu">+ PŘIPNOUT</button><button id="unpin" aria-label="Smazat připnuté polohy">×</button></span></div>
        <label class="chk"><input type="checkbox" id="s_situ"><span class="bx"></span>PŮDORYS SITUACE</label>
      </div>
    </section>

    <section class="sec s-const">
      <div class="chead"><h2>KONSTANTY</h2><span class="unit">[cm]</span></div>
      <div class="cgrid">
        <span>H</span><span class="pair">[<input class="fld" data-key="Hx" data-step="0.5" inputmode="decimal" aria-label="Hlavní bod H, x v cm">;<input class="fld" data-key="Hy" data-step="0.5" inputmode="decimal" aria-label="Hlavní bod H, y v cm">]</span>
        <span>M</span><span class="pair">1:<input class="fld" data-key="N" data-step="1" inputmode="decimal" aria-label="Měřítko 1 ku N"></span>
        <span>VH</span><span><input class="fld" data-key="vh" data-step="0.5" inputmode="decimal" aria-label="Výška horizontu v cm"></span>
        <span>D</span><span><input class="fld" data-key="d" data-step="1" inputmode="decimal" aria-label="Distance v cm"></span>
        <span>D/2</span><span id="c_D2"></span>
        <span>R</span><span id="c_R"></span>
      </div>
    </section>
  </div>

  <div id="exportMsg" role="status"></div>
  <button id="export" aria-label="Exportovat výkres do PDF ve formátu A4">EXPORT<svg viewBox="0 0 26 10" aria-hidden="true"><path d="M0 5H24M19.5 0.8L24.2 5L19.5 9.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
</div>

<script src="js/app.js"></script>
</body>
</html>
