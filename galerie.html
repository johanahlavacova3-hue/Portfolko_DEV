  <script>document.documentElement.classList.add('rv-pending');setTimeout(function(){document.documentElement.classList.remove('rv-pending')},2500);
  if (location.protocol === 'file:') {
    document.documentElement.classList.remove('rv-pending');
    addEventListener('DOMContentLoaded', function () {
      var d = document.createElement('div'); d.className = 'file-warning';
      d.innerHTML = 'Web je otevřený přímo ze souboru, a v tom případě prohlížeč zablokuje skripty (3D logo, portfolio, animace). ' +
        'Spusť ho přes server: ve složce webu <code>npx serve .</code> nebo <code>python3 -m http.server</code>, případně VS Code → Live Server. Podrobnosti v README.';
      document.body.appendChild(d);
    });
  }</script>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
