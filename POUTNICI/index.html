<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Chaty</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

    <h1>Moje 3D Chata</h1>

    <model-viewer 
        src="CHATA.glb" 
        alt="3D model chaty"
        auto-rotate
        camera-controls
        shadow-intensity="1"
        exposure="1"
        style="width: 80vw; height: 60vh; background-color: #f9f9f9;">
    </model-viewer>

    <script src="script.js"></script>
</body>
</html>
