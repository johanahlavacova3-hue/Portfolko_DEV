<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obnova turistické chaty u Rabštejna nad Střelou</title>
    <link rel="stylesheet" href="style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

    <div class="page-container">
        
        <header class="header">
            <a href="https://www.facebook.com/T.O.Poutnici" target="_blank">
                <img src="poutnici.png" alt="Logo Poutníci" class="logo">
            </a>
        </header>

        <main class="model-area">
            <model-viewer 
                src="CHATA.glb" 
                alt="3D model chaty"
                auto-rotate
                camera-controls
                
                camera-orbit="180deg 90deg 2.5m"
                
                ar 
                ar-modes="webxr scene-viewer quick-look"
                ar-scale="fixed" 
                touch-action="pan-y" 
                shadow-intensity="1"
                exposure="2.5">
            </model-viewer>
        </main>

        <footer class="footer">
            <div class="footer-contacts">
                <a href="https://www.facebook.com/obnovachatySTRELAZebrak" target="_blank" class="contact-link-facebook">
                    <p class="contact-link">Facebook</p>
                </a>
                <a href="https://strelazebrak.cz/chata/" target="_blank" class="contact-link-web">
                    <p class="contact-link">Web</p> 
                </a>
            </div>
            
            <div class="footer-support-bar">
                Číslo účtu pro podporu: 
                <strong id="accountNumber" onclick="copyAccount()">2402938869 / 2010</strong>
                <span id="copyMessage" class="copy-message"></span>
            </div>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
