<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Chaty (Nerolovací design)</title>
    <link rel="stylesheet" href="style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

    <div class="page-container">
        
        <header class="header">
            <img src="poutnici.png" alt="Logo Poutníci" class="logo">
        </header>

        <main class="model-area">
            <model-viewer 
                src="CHATA.glb" 
                alt="3D model chaty"
                auto-rotate
                camera-controls
                
                ar 
                ar-modes="webxr scene-viewer quick-look"
                ar-scale="fixed" 
                touch-action="pan-y" 
                shadow-intensity="1"
                exposure="1">
            </model-viewer>
        </main>

        <footer class="footer">
            <div class="footer-contacts">
                <a href="https://www.facebook.com/VaseStranka" target="_blank" class="contact-link-facebook">
                    <img src="facebook_icon.png" alt="Facebook" class="social-icon">
                </a>
                <a href="https://www.vasweb.cz" target="_blank" class="contact-link-web">
                    <p class="contact-link">Web</p> 
                </a>
            </div>
            
            <div class="footer-support-bar">
                Číslo účtu pro podporu: 
                <strong id="accountNumber" onclick="copyAccount()">2402938869 / 2010</strong>
                <span id="copyMessage" class="copy-message"></span>
            </div>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
